[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "noisevault"
version = "0.2.0"
description = "Real device noise, pinned and portable: dated calibration profiles of quantum devices as noise models for Qiskit, Cirq, PennyLane and Stim."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Dev D. Goyal" }]
keywords = ["quantum", "noise model", "calibration", "qiskit", "cirq", "pennylane", "stim"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.8,<3",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
qiskit = ["qiskit>=2.1", "qiskit-aer>=0.17"]
ibm = ["noisevault[qiskit]", "qiskit-ibm-runtime>=0.40"]
cirq = ["cirq-core>=1.5"]
pennylane = ["pennylane>=0.42"]
stim = ["stim>=1.14"]
google = ["noisevault[cirq]", "cirq-google>=1.5"]
all = ["noisevault[qiskit,ibm,cirq,pennylane,stim,google]"]
dev = ["noisevault[all]", "pymatching>=2.2", "pytest>=8", "ruff>=0.9", "build>=1.2"]

[project.scripts]
noisevault = "noisevault.cli:app"
nv = "noisevault.cli:app"

[project.urls]
Repository = "https://github.com/Kyoshiki-Murasaki/noisevault"

[tool.hatch.build.targets.wheel]
packages = ["src/noisevault"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "NOTICE", "CITATION.cff", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["network: needs internet access to a live calibration source"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
